<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanQueue - Admin Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="responsive.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        #reader video { object-fit: cover; border-radius: 1rem; width: 100%; height: 100%; }
        .laser-line { position: absolute; width: 80%; left: 10%; height: 3px; background: #22c55e; box-shadow: 0 0 15px #22c55e; top: 10%; animation: scan 2s infinite linear; z-index: 10; display: none; }
        @keyframes scan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
        .scanner-frame { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1/1; margin: 0 auto; border-radius: 1rem; overflow: hidden; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3); }
        #reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-gray-900 border-b border-gray-800 h-16 flex items-center justify-between px-6 shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-green-500 text-white w-8 h-8 flex items-center justify-center rounded-lg shadow-lg shadow-green-500/50"><i class="fa-solid fa-qrcode"></i></div>
            <h1 class="text-lg font-bold">Admin Scanner</h1>
        </div>
        <div class="text-xs font-semibold bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-full text-green-400">
            <i class="fa-solid fa-signal mr-1 text-[10px]"></i> Live
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="w-full max-w-sm text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">Scan Token</h2>
            <p class="text-sm text-gray-400">Position the farmer's QR code inside the frame to check them in.</p>
        </div>

        <div class="scanner-frame bg-gray-800">
            <div id="reader" class="w-full h-full"></div>
            <div id="laser" class="laser-line"></div>
            <!-- Corners UI -->
            <div class="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-green-500 rounded-tl-lg z-10"></div>
            <div class="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-green-500 rounded-tr-lg z-10"></div>
            <div class="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-green-500 rounded-bl-lg z-10"></div>
            <div class="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-green-500 rounded-br-lg z-10"></div>
        </div>

        <button id="startBtn" onclick="startScanner()" class="mt-10 bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.4)] transition-all flex items-center text-lg w-full max-w-xs justify-center">
            <i class="fa-solid fa-camera mr-2"></i> Start Camera
        </button>
        <p id="scanStatus" class="mt-4 max-w-sm text-center text-sm text-gray-300" role="status" aria-live="polite"></p>
        <p id="phoneHint" class="mt-3 max-w-sm text-center text-xs text-gray-400"></p>
    </main>

    <!-- Success Popup -->
    <div id="resultModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col justify-end hidden">
        <div class="bg-gray-900 border-t border-gray-800 rounded-t-3xl p-6 transform transition-transform translate-y-0 text-white">
            <div class="flex items-center justify-center w-16 h-16 bg-green-500/20 border border-green-500 text-green-500 rounded-full mx-auto mb-4 text-3xl shadow-[0_0_15px_rgba(34,197,94,0.5)]">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-2xl font-bold text-center mb-1">Check-in Successful!</h3>
            <p class="text-center text-sm text-gray-400 mb-6">Live Queue updated instantly.</p>
            
            <div class="bg-gray-800 rounded-xl p-4 mb-6 border border-gray-700">
                <div class="flex justify-between py-2 border-b border-gray-700">
                    <span class="text-xs text-gray-400 font-semibold uppercase">Farmer ID</span>
                    <span class="font-bold text-white" id="resFarmerId">--</span>
                </div>
                <div class="flex justify-between py-2">
                    <span class="text-xs text-gray-400 font-semibold uppercase">Token No</span>
                    <span class="font-bold text-green-400" id="resToken">--</span>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full bg-white text-gray-900 hover:bg-gray-200 font-bold py-4 rounded-xl text-sm transition">
                Scan Next Token
            </button>
        </div>
    </div>

    <script>
        const LOCAL_BACKEND_PORTS = new Set(["3000", "4173", "5000", "5173", "5500", "5501", "8000", "8080", "8081"]);
        const isLocalPage = location.protocol === "file:"
            || ["localhost", "127.0.0.1"].includes(location.hostname)
            || LOCAL_BACKEND_PORTS.has(location.port);
        const API_BASE = isLocalPage
            ? location.port === "5100"
                ? location.origin
                : `http://${["localhost", "127.0.0.1"].includes(location.hostname) || !location.hostname ? "127.0.0.1" : location.hostname}:5100`
            : location.origin;
        let html5QrCode;
        let scanProcessing = false;
        const scanStatus = document.getElementById('scanStatus');
        const startButton = document.getElementById('startBtn');

        function setScanStatus(message, isError = false) {
            scanStatus.textContent = message;
            scanStatus.className = `mt-4 max-w-sm text-center text-sm ${isError ? 'text-red-300' : 'text-gray-300'}`;
        }

        function showPhoneAddress() {
            const securePage = location.protocol === 'https:';
            document.getElementById('phoneHint').textContent = securePage
                ? `Phone par isi HTTPS address se kholein: ${location.origin}/admin-scanner.html`
                : 'Phone camera ke liye HTTPS address zaroori hai. Computer par ngrok http 5100 chalakar uska https://…ngrok…/admin-scanner.html link phone mein kholein. Phone par localhost ya 127.0.0.1 use na karein.';
        }

        function parseFarmerQr(rawValue) {
            const text = String(rawValue || '').trim();
            let payload = {};
            try { payload = JSON.parse(text); }
            catch (error) {
                try { payload = JSON.parse(decodeURIComponent(text)); }
                catch (parseError) {}
            }
            if (!payload || typeof payload !== 'object') payload = {};
            const data = payload.payload || payload.qrData || payload.data || payload;
            const farmer = data.farmer || data.farmerDetails || data.farmerInfo || data.user || data.userData || data.profile || {};
            const booking = data.booking || data.bookingDetails || data.bookingInfo || {};
            let token = data.token || data.tokenNumber || data.bookingToken || data.tokenId || '';
            if (!token && /^https?:\/\//i.test(text)) {
                try {
                    const url = new URL(text);
                    token = url.searchParams.get('token') || url.searchParams.get('tokenNumber') || '';
                } catch (error) {}
            }
            if (!token) {
                const match = text.match(/(?:^|\|)\s*Token(?:\s*(?:Number|No\.?))?:\s*([^|]+)/i);
                if (match) token = match[1].trim();
            }
            if (!token && /^[A-Za-z0-9_-]{3,64}$/.test(text)) token = text;
            const idMatch = text.match(/(?:^|\|)\s*ID:\s*([^|]+)/i);
            const nameMatch = text.match(/(?:^|\|)\s*(?:Farmer\s*)?Name:\s*([^|]+)/i);
            const mobileMatch = text.match(/(?:^|\|)\s*(?:Mobile|Phone):\s*([^|]+)/i);
            const cropMatch = text.match(/(?:^|\|)\s*Crop:\s*([^|]+)/i);
            const quantityMatch = text.match(/(?:^|\|)\s*(?:Quantity|Qty):\s*([^|]+)/i);
            const centerMatch = text.match(/(?:^|\|)\s*Center:\s*([^|]+)/i);
            const dateMatch = text.match(/(?:^|\|)\s*Date:\s*([^|]+)/i);
            const timeMatch = text.match(/(?:^|\|)\s*Time:\s*([^|]+)/i);
            return {
                token: String(token || '').trim(),
                farmer: {
                    ...farmer,
                    id: farmer.id || farmer.farmerId || data.farmerId || idMatch?.[1]?.trim() || '',
                    name: farmer.name || farmer.fullName || farmer.farmerName || data.farmerName || nameMatch?.[1]?.trim() || '',
                    mobile: farmer.mobile || farmer.phone || data.mobile || data.phone || mobileMatch?.[1]?.trim() || ''
                },
                booking: {
                    ...booking,
                    crop: booking.crop || booking.cropName || cropMatch?.[1]?.trim() || '',
                    quantity: booking.quantity || booking.qty || Number(quantityMatch?.[1]?.match(/[\d.]+/)?.[0]) || null,
                    centerName: booking.centerName || booking.center || centerMatch?.[1]?.trim() || '',
                    date: booking.date || dateMatch?.[1]?.trim() || '',
                    time: booking.time || timeMatch?.[1]?.trim() || ''
                }
            };
        }

        async function stopScanner() {
            const scanner = html5QrCode;
            html5QrCode = null;
            if (!scanner) return;
            try {
                if (scanner.isScanning) await scanner.stop();
                scanner.clear();
            } catch (error) {
                console.warn('Scanner cleanup failed:', error);
            }
        }

        async function startScanner() {
            if (!window.isSecureContext || !navigator.mediaDevices?.getUserMedia) {
                setScanStatus('Camera browser ne block kiya. Phone par HTTPS tunnel ka link kholein; localhost sirf usi computer par kaam karta hai.', true);
                showPhoneAddress();
                return;
            }
            if (typeof window.Html5Qrcode !== 'function') {
                setScanStatus('QR scanner library load nahi hui. Internet check karke page reload karein.', true);
                return;
            }

            startButton.disabled = true;
            setScanStatus('Camera permission ka intezar hai…');
            try {
                await stopScanner();
                html5QrCode = new Html5Qrcode('reader');
                let camera = { facingMode: 'environment' };
                try {
                    const cameras = await Html5Qrcode.getCameras();
                    if (cameras.length) {
                        camera = cameras.find(device => /back|rear|environment|trase|arrière/i.test(device.label))?.id
                            || cameras[cameras.length - 1].id;
                    }
                } catch (error) {
                    console.info('Could not enumerate cameras; using the rear-camera preference.', error);
                }

                await html5QrCode.start(
                    camera,
                    { fps: 12, qrbox: (viewfinderWidth, viewfinderHeight) => {
                        const size = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
                        return { width: size, height: size };
                    } },
                    onScanSuccess,
                    () => {}
                );
                startButton.classList.add('hidden');
                document.getElementById('laser').style.display = 'block';
                setScanStatus('Camera chalu hai. QR code ko frame mein seedha aur roshni mein rakhein.');
            } catch (error) {
                console.error('Camera start failed:', error);
                await stopScanner();
                startButton.classList.remove('hidden');
                document.getElementById('laser').style.display = 'none';
                const detail = String(error?.message || error || '');
                const message = /NotAllowed|Permission|denied/i.test(detail)
                    ? 'Camera permission block hai. Browser settings mein is site ke liye Camera Allow karke dobara try karein.'
                    : /NotFound|no camera/i.test(detail)
                        ? 'Phone ka camera detect nahi hua. Camera kisi aur app mein khula ho to use band karein.'
                        : `Camera start nahi hua (${detail || 'unknown error'}). HTTPS link aur browser camera permission check karein.`;
                setScanStatus(message, true);
                showPhoneAddress();
            } finally {
                startButton.disabled = false;
            }
        }

        async function onScanSuccess(decodedText) {
            if (scanProcessing) return;
            const qrData = parseFarmerQr(decodedText);

            if (String(qrData.token || "").trim()) {
                const tkn = String(qrData.token || "").trim();
                scanProcessing = true;
                setScanStatus(`Token ${tkn} mila. Backend mein save ho raha hai…`);
                await stopScanner();
                document.getElementById('laser').style.display = 'none';
                try {
                    const health = await fetch(`${API_BASE}/api/health`);
                    if (!health.ok) throw new Error('Backend server reachable nahi hai.');
                    const response = await fetch(`${API_BASE}/api/admin/scan`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: tkn,
                            farmer: qrData.farmer || {},
                            booking: qrData.booking || {}
                        })
                    });
                    const data = await response.json();
                    if (!response.ok && response.status !== 409) {
                        throw new Error(data.message || "Token scan failed.");
                    }
                    const savedToken = String(data.data?.token || data.tokenStatus?.token || "");
                    if (savedToken && savedToken !== tkn) {
                        throw new Error(`Token mismatch: QR ${tkn}, saved record ${savedToken}.`);
                    }

                    document.getElementById('resFarmerId').innerText = data.data?.farmer?.id || data.tokenStatus?.farmer?.id || qrData.farmer?.id || "--";
                    document.getElementById('resToken').innerText = savedToken || tkn;
                    document.getElementById('resultModal').classList.remove('hidden');
                    window.location.href = `${API_BASE}/mandi.html?token=${encodeURIComponent(savedToken || tkn)}`;
                } catch (error) {
                    console.error("Scan sync error:", error);
                    setScanStatus(`${error.message || 'Scan backend mein save nahi hua.'} Internet aur server connection check karke dobara scan karein.`, true);
                    scanProcessing = false;
                    startButton.classList.remove('hidden');
                }
            } else {
                setScanStatus('Is QR mein KisanQueue token nahi mila. Farmer ke “My Token” page ka QR scan karein.', true);
            }
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            scanProcessing = false;
            startScanner();
        }

        showPhoneAddress();
    </script>
</body>
</html>
