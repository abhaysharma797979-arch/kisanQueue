<!DOCTYPE html>

<head>

<body class="flex h-screen overflow-hidden">

    <!-- EXACT Sidebar -->

        <div>
            <div class="h-20 flex items-center px-6 border-b border-gray-100">
                <div class="flex items-center space-x-3">
                    <div class="bg-orange-100 text-orange-500 p-2 rounded-full text-lg"><i
                            class="fa-solid fa-wheat-awn"></i></div>
                    <div>
                        <h1 class="text-lg font-bold text-textDark leading-tight">KisanQueue</h1>
                        <p class="text-[10px] text-gray-500">Smart Procurement Platform</p>
                    </div>
                </div>
            </div>

            <nav class="p-4 space-y-1.5">
                <a href="index.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-house w-5 mr-2"></i> <span data-i18n="menu_dashboard">Dashboard</span>
                </a>
                <a href="book new slot.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-regular fa-calendar-plus w-5 mr-2"></i> <span data-i18n="menu_book_slot">Book New
                        Slot</span>
                </a>
                <a href="my booking.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-list-check w-5 mr-2"></i> <span data-i18n="menu_my_bookings">My

                </a>
                <a href="my token.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-qrcode w-5 mr-2"></i> <span data-i18n="menu_my_token">My Token</span>
                </a>
                <a href="live queue.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-users-line w-5 mr-2"></i> <span data-i18n="menu_live_queue">Live Queue</span>
                </a>

                <!-- ACTIVE LINK -->
                <a href="procurement centers.html"
                    class="flex items-center px-4 py-2.5 bg-primary text-white rounded-lg text-sm font-semibold shadow-sm shadow-green-200">
                    <i class="fa-solid fa-warehouse w-5 mr-2"></i> <span data-i18n="menu_centers">Procurement
                        Centers</span>
                </a>

                <a href="my payments.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-wallet w-5 mr-2"></i> <span data-i18n="menu_payments">My Payments</span>
                </a>
                <a href="profile.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-regular fa-user w-5 mr-2"></i> <span data-i18n="menu_profile">Profile</span>
                </a>
                <a href="support.html"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-gray-50 hover:text-primary rounded-lg text-sm font-medium transition">
                    <i class="fa-solid fa-headset w-5 mr-2"></i> <span data-i18n="menu_support">Support</span>
                </a>
                <a href="#" onclick="logout()"
                    class="flex items-center px-4 py-2.5 text-gray-600 hover:bg-red-50 hover:text-red-600 rounded-lg text-sm font-medium transition mt-4">
                    <i class="fa-solid fa-arrow-right-from-bracket w-5 mr-2"></i> <span
                        data-i18n="menu_logout">Logout</span>
                </a>
            </nav>
        </div>

        <div class="p-5">
            <div class="bg-[#f8faf9] rounded-xl border border-gray-100 overflow-hidden text-center pb-4">
                <img src="support.png" class="w-full h-24 object-cover">
                <h4 class="font-bold text-gray-800 mt-3 text-sm" data-i18n="support_title">सहायता चाहिए?</h4>
                <p class="text-[11px] text-gray-500 mt-1 mb-3 px-3" data-i18n="support_desc">हमारी सहायता टीम हमेशा आपके
                    साथ है।</p>
                <button
                    class="border border-primary text-primary hover:bg-green-50 text-xs font-semibold py-2 px-4 rounded-md transition mx-auto flex items-center">
                    <i class="fa-solid fa-headset mr-2"></i> <span data-i18n="support_btn">Contact Support</span>
                </button>
            </div>
        </div>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-hidden relative">
        <!-- Top Header -->
        <header class="h-20 bg-white border-b border-gray-200 flex justify-between items-center px-6 shrink-0">
            <button class="text-gray-500 hover:text-gray-800 md:hidden"><i
                    class="fa-solid fa-bars text-xl"></i></button>
            <div class="hidden md:block"></div>

            <div class="flex items-center space-x-4">
                <div class="bg-gray-100 rounded-lg p-1 flex space-x-1">
                    <button onclick="changeLanguage('hi')"
                        class="text-xs font-bold px-3 py-1.5 rounded bg-white shadow-sm text-primary">अ</button>
                    <button onclick="changeLanguage('en')"
                        class="text-xs font-bold px-3 py-1.5 rounded hover:bg-gray-200 text-gray-600">A</button>
                </div>

                <button class="relative text-gray-500 hover:text-primary transition ml-2">
                    <i class="fa-regular fa-bell text-xl"></i>
                    <span
                        class="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border-2 border-white">0</span>
                </button>

                <div class="flex items-center space-x-3 border-l border-gray-200 pl-4 ml-2 cursor-pointer">
                    <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?q=80&w=100&auto=format&fit=crop"
                        class="w-10 h-10 rounded-full object-cover border border-gray-200">
                    <div class="hidden sm:block">
                        <h3 class="text-sm font-bold text-gray-800" id="headerName">Loading...</h3>
                        <p class="text-xs text-gray-500">ID: <span id="farmerID">FRM10245</span></p>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 overflow-y-auto p-6 md:p-8">
            <div class="max-w-4xl mx-auto">
                <h2 class="text-2xl font-bold text-gray-900" data-i18n="menu_centers">खरीद केंद्र</h2>
                <p class="text-sm text-gray-600 mt-1 mb-6" data-i18n="centers_subtitle">अपने पास के खरीद केंद्र देखें और
                    डिफ़ॉल्ट केंद्र चुनें।</p>

                <div class="relative mb-5">
                    <i
                        class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
                    <input id="searchBox" type="text" placeholder="केंद्र या शहर खोजें..."
                        class="w-full border border-gray-200 rounded-xl pl-11 pr-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-primary/40 focus:border-primary bg-white">
                </div>

                <div id="centerList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </div>
        </main>
    </div>

    <!-- External Language Script -->
    <script src="language.js"></script>

    <script>
        // Centralized procurement centers database
        const allCenters = [
            { id: "C1", name: "Lucknow Procurement Center", district: "Lucknow", address: "Gomti Nagar, Lucknow", open: "08:00 AM", close: "05:00 PM", status: "Open" },
            { id: "C2", name: "Mohanlalganj Mandi", district: "Lucknow", address: "Mohanlalganj, Lucknow", open: "08:00 AM", close: "05:00 PM", status: "Open" },
            { id: "C3", name: "Kanpur Mandi", district: "Kanpur", address: "Kalyanpur, Kanpur", open: "07:00 AM", close: "04:00 PM", status: "Open" },
            { id: "C4", name: "Ballia Krishi Mandi", district: "Ballia", address: "Ballia City", open: "08:00 AM", close: "05:00 PM", status: "Open" },
            { id: "C5", name: "Nagra Procurement Center", district: "Ballia", address: "Nagra, Ballia", open: "08:00 AM", close: "04:00 PM", status: "Closed" }
        ];

        function renderCenters(filter = "") {
            const el = document.getElementById("centerList");
            const defaultCenterId = localStorage.getItem("defaultCenterId") || "C4"; // Default to Ballia or saved

            const list = allCenters.filter(c =>
                !filter || c.name.toLowerCase().includes(filter.toLowerCase()) || c.address.toLowerCase().includes(filter.toLowerCase()) || c.district.toLowerCase().includes(filter.toLowerCase())
            );

            if (!list.length) {
                el.innerHTML = `<p class="text-sm text-gray-500 col-span-2 text-center py-10">कोई केंद्र नहीं मिला।</p>`;
                return;
            }

            el.innerHTML = list.map(c => {
                const isDefault = defaultCenterId === c.id;
                // Random dynamic capacity simulation for realism
                const pctFull = Math.min(95, Math.round(30 + (c.id.charCodeAt(0) * 7) % 50));

                return `
                <div class="bg-white rounded-xl border ${isDefault ? "border-primary ring-1 ring-primary/30" : "border-gray-100"} shadow-sm p-5 transition hover:shadow-md">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center gap-3">
                            <div class="w-11 h-11 rounded-full bg-green-50 flex items-center justify-center text-primary text-lg shrink-0">
                                <i class="fa-solid fa-warehouse"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-gray-900 text-sm">${c.name}</h4>
                                <p class="text-xs text-gray-500 mt-0.5">${c.address} (${c.district})</p>
                            </div>
                        </div>
                        ${isDefault ? `<span class="text-[10px] font-bold text-primary bg-green-50 px-2.5 py-1 rounded-full shrink-0 border border-green-200">डिफ़ॉल्ट</span>` : ""}
                    </div>
                    
                    <div class="grid grid-cols-2 gap-3 mt-4 text-xs text-gray-500">
                        <div><i class="fa-regular fa-clock mr-1"></i>${c.open} - ${c.close}</div>
                        <div><span class="font-semibold ${c.status === 'Open' ? 'text-green-600' : 'text-red-600'}">${c.status === 'Open' ? 'खुला है' : 'बंद है'}</span></div>
                    </div>
                    
                    <div class="mt-3">
                        <div class="flex justify-between text-[11px] text-gray-500 mb-1"><span>आज की क्षमता</span><span>${pctFull}%</span></div>
                        <div class="w-full bg-gray-100 rounded-full h-1.5"><div class="bg-primary h-1.5 rounded-full" style="width:${pctFull}%"></div></div>
                    </div>
                    
                    <div class="flex gap-2 mt-4">
                        <button onclick="setDefault('${c.id}')" ${isDefault ? "disabled" : ""} class="flex-1 text-xs font-semibold ${isDefault ? "bg-gray-100 text-gray-400 cursor-not-allowed" : "bg-primary text-white hover:bg-primaryDark"} rounded-lg py-2.5 transition">
                            ${isDefault ? "चुना गया" : "डिफ़ॉल्ट बनाएं"}
                        </button>
                        <a href="book new slot.html" class="flex-1 text-center text-xs font-semibold border border-gray-200 text-gray-700 hover:border-primary hover:text-primary rounded-lg py-2.5 transition">यहां बुक करें</a>
                    </div>
                </div>`;
            }).join("");

            if (typeof applyLanguage === "function") {
                applyLanguage(localStorage.getItem("kisanLanguage") || "hi");
            }
        }

        function setDefault(id) {
            localStorage.setItem("defaultCenterId", id);
            const selectedCenter = allCenters.find(c => c.id === id);
            if (selectedCenter) {
                localStorage.setItem("farmerDistrict", selectedCenter.district);
            }
            renderCenters(document.getElementById("searchBox").value);
        }

        window.onload = function () {
            document.getElementById("headerName").innerText = localStorage.getItem("farmerName") || "Abhay Sharma";
            document.getElementById("farmerID").innerText = localStorage.getItem("farmerID") || "FRM10245";

            renderCenters("");
            document.getElementById("searchBox").addEventListener("input", (e) => renderCenters(e.target.value));
        };

        function logout() {
            if (confirm("Are you sure you want to logout?")) {
                sessionStorage.clear();
                window.location.href = "index.html";
            }
        }
    </script>
</body>

</html>
