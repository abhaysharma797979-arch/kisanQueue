<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanQueue - Basic Information</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="responsive.css">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f9fafb;
        }

        .input-icon-box {
            background-color: #f9fafb;
        }

        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: { colors: { primary: '#0f7634', primaryDark: '#0a5223', textDark: '#1e3a29' } }
            }
        }
    </script>
</head>

<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 h-20 flex justify-between items-center px-8 shrink-0 z-20">
        <div class="flex items-center space-x-3">
            <div class="bg-orange-100 text-orange-500 p-2 rounded-full text-xl"><i class="fa-solid fa-wheat-awn"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold text-textDark leading-tight">KisanQueue</h1>
                <p class="text-xs text-gray-500" data-key="subtitle">Smart Procurement Platform</p>
            </div>
        </div>
        <div class="flex space-x-4 items-center">
            <div class="relative">
                <button onclick="toggleLangMenu()"
                    class="border border-gray-300 rounded-md px-4 py-2 text-sm text-gray-700 flex items-center space-x-2 hover:bg-gray-50 focus:outline-none">
                    <i class="fa-solid fa-globe"></i>
                    <span id="currentLang">English</span>
                    <i class="fa-solid fa-chevron-down text-xs ml-2"></i>
                </button>
                <div id="langMenu"
                    class="absolute hidden right-0 mt-2 w-32 bg-white border border-gray-200 rounded-md shadow-lg z-50 overflow-hidden">
                    <button onclick="setLanguage('en')"
                        class="w-full text-left px-4 py-2 text-sm hover:bg-green-50 text-gray-700 transition">English</button>
                    <button onclick="setLanguage('hi')"
                        class="w-full text-left px-4 py-2 text-sm hover:bg-green-50 text-gray-700 transition">हिंदी</button>
                </div>
            </div>
            <button
                class="border border-gray-300 rounded-md px-4 py-2 text-sm text-gray-700 flex items-center space-x-2 hover:bg-gray-50">
                <i class="fa-regular fa-circle-question text-primary"></i> <span data-key="help">Help</span>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-grow flex flex-col lg:flex-row overflow-hidden">

        <!-- Left Banner -->
        <div
            class="w-full lg:w-1/3 xl:w-4/12 relative overflow-hidden bg-gray-900 flex flex-col justify-between hidden lg:flex">
            <img src="basic-information.png" alt="Banner Background"
                class="absolute inset-0 w-full h-full object-cover opacity-80">
            <div class="absolute inset-0 bg-gradient-to-r from-white/95 via-white/80 to-transparent"></div>

            <div class="relative z-10 p-12 pt-16">
                <h2 class="text-4xl font-bold text-textDark mb-4 leading-tight" data-key="heroTitle">Smart
                    Procurement<br>for Farmers</h2>
                <p class="text-gray-800 font-medium mb-10 text-lg" data-key="heroDesc">Book your slot, track your
                    queue,<br>and get timely payments.</p>
            </div>
        </div>

        <!-- Right Section (Form) -->
        <div class="w-full lg:w-2/3 xl:w-8/12 bg-gray-50 flex justify-center py-10 px-4 sm:px-8 overflow-y-auto">
            <div class="w-full max-w-5xl bg-white border border-gray-100 rounded-xl shadow-sm p-8 sm:p-10">

                <!-- Stepper -->
                <div class="w-full max-w-3xl mx-auto mb-10 relative">
                    <div class="absolute top-4 left-10 right-10 h-[2px] bg-primary z-0"></div>
                    <div class="flex justify-between relative z-10">
                        <div class="flex flex-col items-center w-36">
                            <div
                                class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold mb-2 ring-4 ring-white">
                                <i class="fa-solid fa-check"></i></div>
                            <span class="text-xs text-gray-500 font-medium" data-key="step1">Phone Verification</span>
                        </div>
                        <div class="flex flex-col items-center w-36">
                            <div
                                class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold mb-2 ring-4 ring-white">
                                <i class="fa-solid fa-check"></i></div>
                            <span class="text-xs text-gray-500 font-medium" data-key="step2">Aadhaar Details</span>
                        </div>
                        <div class="flex flex-col items-center w-36">
                            <div
                                class="w-8 h-8 rounded-full bg-primary text-white flex items-center justify-center text-sm font-bold mb-2 ring-4 ring-white">
                                3</div>
                            <span class="text-xs text-primary font-bold" data-key="step3">Basic Information</span>
                        </div>
                    </div>
                </div>

                <!-- FORM START -->
                <form id="registrationForm" onsubmit="return false;">

                    <!-- Section 1: Basic Information -->
                    <div class="mb-8">
                        <h3 class="text-lg font-bold text-primary mb-1" data-key="formTitle">Basic Information</h3>
                        <p class="text-xs text-gray-500 mb-5" data-key="formDesc">Please provide your basic details to
                            create your account.</p>

                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Full Name <span
                                        class="text-red-500">*</span></label>
                                <div class="flex border border-gray-300 rounded-md overflow-hidden">
                                    <div class="input-icon-box px-3 py-2 border-r border-gray-300 flex items-center"><i
                                            class="fa-regular fa-user text-sm"></i></div>
                                    <input type="text" id="fullName" class="w-full px-3 py-2 text-sm outline-none"
                                        placeholder="Enter your full name" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Email Address <span
                                        class="text-red-500">*</span></label>
                                <div class="flex border border-gray-300 rounded-md overflow-hidden">
                                    <div class="input-icon-box px-3 py-2 border-r border-gray-300 flex items-center"><i
                                            class="fa-regular fa-envelope text-sm"></i></div>
                                    <input type="email" id="email" class="w-full px-3 py-2 text-sm outline-none"
                                        placeholder="Enter your email address" required>
                                </div>
                            </div>

                            <!-- Mobile Number Display -->
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Mobile Number <span
                                        class="text-red-500">*</span></label>
                                <div class="flex border border-gray-200 rounded-md overflow-hidden bg-gray-50">
                                    <div class="px-3 py-2 border-r border-gray-200 flex items-center"><i
                                            class="fa-solid fa-phone text-sm"></i></div>
                                    <input type="text" id="displayMobileInput"
                                        class="w-full px-3 py-2 text-sm outline-none bg-gray-50 font-medium" disabled>
                                </div>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Date of Birth <span
                                        class="text-red-500">*</span></label>
                                <div class="flex border border-gray-300 rounded-md overflow-hidden">
                                    <div class="input-icon-box px-3 py-2 border-r border-gray-300 flex items-center"><i
                                            class="fa-regular fa-calendar text-sm"></i></div>
                                    <input type="date" id="dob" class="w-full px-3 py-2 text-sm outline-none" required>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Gender <span
                                        class="text-red-500">*</span></label>
                                <div class="flex items-center space-x-5 py-2">
                                    <label class="flex items-center space-x-2 text-sm cursor-pointer"><input
                                            type="radio" name="gender" value="Male" class="accent-primary"
                                            checked><span>Male</span></label>
                                    <label class="flex items-center space-x-2 text-sm cursor-pointer"><input
                                            type="radio" name="gender" value="Female"
                                            class="accent-primary"><span>Female</span></label>
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Marital Status</label>
                                <select id="maritalStatus"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm outline-none">
                                    <option value="">Select marital status</option>
                                    <option value="Single">Single</option>
                                    <option value="Married">Married</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200 mb-6">

                    <!-- Section 2: Address Details -->
                    <div class="mb-8">
                        <h3 class="text-lg font-bold text-primary mb-5">Address Details</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">House / Building No.
                                    <span class="text-red-500">*</span></label>
                                <input type="text" id="houseNo"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Street / Area <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="street"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Pincode <span
                                        class="text-red-500">*</span></label>
                                <input type="number" id="pincode"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">State <span
                                        class="text-red-500">*</span></label>
                                <select id="state" onchange="updateDistricts()"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm outline-none"
                                    required></select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">District <span
                                        class="text-red-500">*</span></label>
                                <select id="district"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm outline-none disabled:bg-gray-50"
                                    required disabled>
                                    <option value="">Select State First</option>
                                </select>
                            </div>

                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Tehsil / Block <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="tehsil"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Village <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="village"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>
                        </div>
                    </div>

                    <hr class="border-gray-200 mb-6">

                    <!-- Section 3: Bank Details -->
                    <div class="mb-10">
                        <h3 class="text-lg font-bold text-primary mb-5">Bank Details</h3>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Bank Name <span
                                        class="text-red-500">*</span></label>
                                <select id="bankName"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2.5 text-sm outline-none"
                                    required>
                                    <option value="">Select bank</option>
                                    <option value="SBI">State Bank of India</option>
                                    <option value="HDFC">HDFC Bank</option>
                                    <option value="PNB">Punjab National Bank</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Account Number <span
                                        class="text-red-500">*</span></label>
                                <input type="number" id="accountNumber"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">IFSC Code <span
                                        class="text-red-500">*</span></label>
                                <input type="text" id="ifscCode"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none uppercase"
                                    required>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-gray-700 mb-1.5">Account Holder Name
                                    <span class="text-red-500">*</span></label>
                                <input type="text" id="accountHolder"
                                    class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm outline-none"
                                    required>
                            </div>
                        </div>
                    </div>

                    <!-- Bottom Action Buttons -->
                    <div class="flex justify-between items-center border-t border-gray-200 pt-6">
                        <button type="button" onclick="window.history.back()"
                            class="border border-gray-300 text-gray-700 px-6 py-2.5 rounded-md text-sm font-semibold hover:bg-gray-50 flex items-center transition">
                            <i class="fa-solid fa-arrow-left mr-2"></i> Back
                        </button>

                        <button type="button" id="submitBtn" onclick="submitRegistration()"
                            class="bg-[#0f7634] hover:bg-[#0a5223] text-white px-8 py-2.5 rounded-md text-sm font-semibold flex items-center transition shadow-md">
                            Review & Submit <i class="fa-solid fa-arrow-right ml-2"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script>
        // --- 1. DATA AND ONLOAD LOGIC ---
        const locationData = {
            "Uttar Pradesh": ["Agra", "Aligarh", "Ballia", "Bareilly", "Gorakhpur", "Kanpur Nagar", "Lucknow", "Varanasi"],
            "Bihar": ["Chhapra", "Gaya", "Patna", "Muzaffarpur"],
            "Delhi": ["Central Delhi", "New Delhi", "South Delhi"]
        };

        window.onload = function () {
            const savedMobile = localStorage.getItem("verifiedMobile");
            if (savedMobile && savedMobile.length === 10) {
                document.getElementById('displayMobileInput').value = "+91 " + savedMobile;
            } else {
                document.getElementById('displayMobileInput').value = "Not Verified";
            }

            const stateSelect = document.getElementById("state");
            stateSelect.innerHTML = `<option value="">Select State</option>`;
            for (let state in locationData) {
                let option = document.createElement("option");
                option.value = state;
                option.text = state;
                stateSelect.appendChild(option);
            }
        };

        function updateDistricts() {
            const stateSelect = document.getElementById("state");
            const districtSelect = document.getElementById("district");
            const selectedState = stateSelect.value;

            districtSelect.innerHTML = `<option value="">Select District</option>`;

            if (selectedState !== "") {
                const districts = locationData[selectedState];
                districts.sort();
                districts.forEach(district => {
                    let option = document.createElement("option");
                    option.value = district;
                    option.text = district;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
                districtSelect.classList.remove("disabled:bg-gray-50");
            } else {
                districtSelect.disabled = true;
                districtSelect.classList.add("disabled:bg-gray-50");
                districtSelect.innerHTML = `<option value="">Select State First</option>`;
            }
        }

        // --- 3. API SUBMISSION LOGIC (100% RELOAD PROOF) ---
        const API_BASE = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost') && window.location.port !== '5001' ? 'http://127.0.0.1:5001' : '';

        async function submitRegistration() {
            const form = document.getElementById('registrationForm');

            // Ye check karega ki koi field khali toh nahi hai
            if (!form.checkValidity()) {
                form.reportValidity(); 
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            const originalBtnHtml = submitBtn.innerHTML;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i> Submitting...';
            submitBtn.disabled = true;

            try {
                const checkedGender = document.querySelector('input[name="gender"]:checked');
                const genderSelected = checkedGender ? checkedGender.value : "Male";
                const mobileNumber = localStorage.getItem("verifiedMobile") || "9876543210";

                const formData = {
                    fullName: document.getElementById('fullName').value,
                    email: document.getElementById('email').value,
                    mobile: mobileNumber,
                    dob: document.getElementById('dob').value,
                    gender: genderSelected,
                    maritalStatus: document.getElementById('maritalStatus').value,
                    address: {
                        houseNo: document.getElementById('houseNo').value,
                        street: document.getElementById('street').value,
                        pincode: document.getElementById('pincode').value,
                        state: document.getElementById('state').value,
                        district: document.getElementById('district').value,
                        tehsil: document.getElementById('tehsil').value,
                        village: document.getElementById('village').value
                    },
                    bankDetails: {
                        bankName: document.getElementById('bankName').value,
                        accountNumber: document.getElementById('accountNumber').value,
                        ifscCode: document.getElementById('ifscCode').value,
                        accountHolder: document.getElementById('accountHolder').value
                    }
                };

                const response = await fetch(`${API_BASE}/api/register/submit-basic-info`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem("farmerName", document.getElementById('fullName').value);
                    localStorage.setItem("farmerLocation", document.getElementById('village').value + ", " + document.getElementById('district').value);
                    localStorage.setItem("farmerID", "FRM" + Math.floor(Math.random() * 90000 + 10000));

                    // Updated alert and redirection to login page
                    alert("✅ आपका रजिस्ट्रेशन सफलतापूर्वक हो गया है! (Registration Successful!)");
                    window.location.href = "index.html";

                } else {
                    alert("❌ Error: " + data.message);
                    submitBtn.innerHTML = originalBtnHtml;
                    submitBtn.disabled = false;
                }
            } catch (error) {
                console.error("Submission Error:", error);
                alert("Backend is not running. Please check your connection!");
                submitBtn.innerHTML = originalBtnHtml;
                submitBtn.disabled = false;
            }
        }
    </script>
</body>

</html>
