<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KisanQueue - Admin Scanner Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="responsive.css">
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: white; }
        #reader video { object-fit: cover; border-radius: 1rem; width: 100%; height: 100%; }
        .laser-line { position: absolute; width: 80%; left: 10%; height: 3px; background: #22c55e; box-shadow: 0 0 15px #22c55e; top: 10%; animation: scan 2s infinite linear; z-index: 10; display: none; }
        @keyframes scan { 0% { top: 10%; } 50% { top: 90%; } 100% { top: 10%; } }
        .scanner-frame { position: relative; width: 100%; max-width: 320px; aspect-ratio: 1/1; margin: 0 auto; border-radius: 1rem; overflow: hidden; box-shadow: 0 0 0 4px rgba(34, 197, 94, 0.3); }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="bg-gray-900 border-b border-gray-800 h-16 flex items-center justify-between px-6 shrink-0 shadow-md">
        <div class="flex items-center space-x-3">
            <div class="bg-green-500 text-white w-8 h-8 flex items-center justify-center rounded-lg shadow-lg shadow-green-500/50"><i class="fa-solid fa-qrcode"></i></div>
            <h1 class="text-lg font-bold">Admin Scanner</h1>
        </div>
        <div class="text-xs font-semibold bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-full text-green-400">
            <i class="fa-solid fa-signal mr-1 text-[10px]"></i> Live
        </div>
    </header>

    <main class="flex-1 flex flex-col items-center justify-center p-6 relative">
        <div class="w-full max-w-sm text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">Scan Token</h2>
            <p class="text-sm text-gray-400">Position the farmer's QR code inside the frame to check them in.</p>
        </div>

        <div class="scanner-frame bg-gray-800">
            <div id="reader" class="w-full h-full"></div>
            <div id="laser" class="laser-line"></div>
            <!-- Corners UI -->
            <div class="absolute top-4 left-4 w-8 h-8 border-t-4 border-l-4 border-green-500 rounded-tl-lg z-10"></div>
            <div class="absolute top-4 right-4 w-8 h-8 border-t-4 border-r-4 border-green-500 rounded-tr-lg z-10"></div>
            <div class="absolute bottom-4 left-4 w-8 h-8 border-b-4 border-l-4 border-green-500 rounded-bl-lg z-10"></div>
            <div class="absolute bottom-4 right-4 w-8 h-8 border-b-4 border-r-4 border-green-500 rounded-br-lg z-10"></div>
        </div>

        <button id="startBtn" onclick="startScanner()" class="mt-10 bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-10 rounded-full shadow-[0_0_20px_rgba(34,197,94,0.4)] transition-all flex items-center text-lg w-full max-w-xs justify-center">
            <i class="fa-solid fa-camera mr-2"></i> Start Camera
        </button>
    </main>

    <!-- Success Popup -->
    <div id="resultModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex flex-col justify-end hidden">
        <div class="bg-gray-900 border-t border-gray-800 rounded-t-3xl p-6 transform transition-transform translate-y-0 text-white">
            <div class="flex items-center justify-center w-16 h-16 bg-green-500/20 border border-green-500 text-green-500 rounded-full mx-auto mb-4 text-3xl shadow-[0_0_15px_rgba(34,197,94,0.5)]">
                <i class="fa-solid fa-check"></i>
            </div>
            <h3 class="text-2xl font-bold text-center mb-1">Check-in Successful!</h3>
            <p class="text-center text-sm text-gray-400 mb-6">Live Queue updated instantly.</p>
            
            <div class="bg-gray-800 rounded-xl p-4 mb-6 border border-gray-700">
                <div class="flex justify-between py-2 border-b border-gray-700">
                    <span class="text-xs text-gray-400 font-semibold uppercase">Farmer ID</span>
                    <span class="font-bold text-white" id="resFarmerId">--</span>
                </div>
                <div class="flex justify-between py-2">
                    <span class="text-xs text-gray-400 font-semibold uppercase">Token No</span>
                    <span class="font-bold text-green-400" id="resToken">--</span>
                </div>
            </div>

            <button onclick="closeModal()" class="w-full bg-white text-gray-900 hover:bg-gray-200 font-bold py-4 rounded-xl text-sm transition">
                Scan Next Token
            </button>
        </div>
    </div>

    <script>
        let html5QrCode;

        function startScanner() {
            document.getElementById('startBtn').classList.add('hidden');
            document.getElementById('laser').style.display = 'block';
            
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                onScanSuccess,
                (errorMessage) => {} 
            ).catch((err) => {
                alert("Camera Error: Please allow camera permissions or check device.");
                document.getElementById('startBtn').classList.remove('hidden');
                document.getElementById('laser').style.display = 'none';
            });
        }

        async function onScanSuccess(decodedText) {
            if(decodedText.includes("KisanQueue")) {
                html5QrCode.stop().then(() => document.getElementById('reader').innerHTML = "");
                document.getElementById('laser').style.display = 'none';
                
                let tkn = "--", fId = "--";
                decodedText.split('|').forEach(part => {
                    if(part.startsWith("Token:")) tkn = part.replace("Token:", "");
                    if(part.startsWith("ID:")) fId = part.replace("ID:", "");
                });

                // MAGIC TRICK: Send data to Node.js backend
                try {
                    // Forcefully using relative path so it uses ngrok's domain
                    const response = await fetch('/api/admin/scan', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: tkn })
                    });
                    
                    if(!response.ok) {
                        alert("❌ Server Error: Token Backend tak nahi pahuncha.");
                        return;
                    }
                } catch(e) { 
                    alert("❌ Backend is not running!\n\nPlease run 'ngrok http 5001' and open THAT link in your phone.");
                    console.log("Sync error", e);
                    return; 
                }

                document.getElementById('resFarmerId').innerText = fId;
                document.getElementById('resToken').innerText = tkn;
                
                let audio = new Audio('https://www.myinstants.com/media/sounds/success-bell.mp3');
                audio.play().catch(e => {});

                document.getElementById('resultModal').classList.remove('hidden');
            } else {
                alert("❌ यह किसान कतार का सही टोकन नहीं है। (Invalid QR)");
            }
        }

        function closeModal() {
            document.getElementById('resultModal').classList.add('hidden');
            startScanner(); // Automatically restart camera for next scan
        }
    </script>
</body>
</html>
